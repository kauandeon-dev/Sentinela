name: Versão portátil (Windows)

# Monta o Sentinela portátil (Python embutido + PostgreSQL/MariaDB portáteis)
# e o instalador (Inno Setup), valida os dois num Windows "limpo" (sem
# PostgreSQL instalado; pasta com espaço e acento; instalar, atualizar com o
# Sentinela rodando e desinstalar) e publica na página de Releases.
on:
  push:
    branches: [main, teste-windows]
  workflow_dispatch:

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Clientes do MariaDB (para copiar mariadb e mariadb-dump) e Inno Setup
        shell: pwsh
        run: |
          choco install mariadb -y --no-progress | Out-Null
          choco install innosetup -y --no-progress | Out-Null
      - name: Montar a pasta portátil
        shell: pwsh
        run: ./portatil/montar.ps1 -Saida "$env:RUNNER_TEMP\pacote\Sentinela"
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinela-Portatil-Windows
          path: ${{ runner.temp }}/pacote/Sentinela-Portatil-Windows.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinela-Instalador
          path: ${{ runner.temp }}/pacote/Sentinela-Instalador.exe
          compression-level: 0

  validar:
    needs: construir
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6   # só para rodar o roteiro de validação
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: Sentinela-Portatil-Windows
      - name: Simular PC sem PostgreSQL instalado
        shell: pwsh
        run: |
          Get-Service -Name "postgresql*" | Stop-Service -ErrorAction SilentlyContinue
          Rename-Item "C:\Program Files\PostgreSQL" "PostgreSQL-removido"
          if (Get-Command pg_dump -ErrorAction SilentlyContinue) { throw "pg_dump ainda no PATH" }
      - name: Extrair numa pasta com espaço e acento
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "C:\Teste Portátil" | Out-Null
          Expand-Archive Sentinela-Portatil-Windows.zip "C:\Teste Portátil" -Force
          Get-ChildItem "C:\Teste Portátil\Sentinela"
      - name: Preparar MySQL 8 local com root sem senha (caching_sha2_password)
        shell: pwsh
        run: |
          $mysqld = (Get-ChildItem "C:\Program Files\MySQL\MySQL Server *\bin\mysqld.exe" -ErrorAction SilentlyContinue |
                     Select-Object -Last 1).FullName
          if (-not $mysqld) {
            Invoke-WebRequest "https://downloads.mysql.com/archives/get/p/23/file/mysql-8.4.3-winx64.zip" -OutFile mysql.zip
            Expand-Archive mysql.zip C:\mysql
            $mysqld = (Get-ChildItem "C:\mysql\*\bin\mysqld.exe" | Select-Object -First 1).FullName
          }
          & $mysqld --version
          & $mysqld --initialize-insecure --datadir=C:\mysql-dados --console 2>&1 | Select-Object -Last 3
          # Uma instrução por linha (exigência do --init-file)
          @(
            "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED WITH caching_sha2_password BY '';",
            "GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;",
            "CREATE DATABASE IF NOT EXISTS loja_mysql CHARACTER SET utf8mb4;",
            "CREATE TABLE IF NOT EXISTS loja_mysql.clientes (id INT PRIMARY KEY AUTO_INCREMENT, nome VARCHAR(100), cidade VARCHAR(80)) DEFAULT CHARSET=utf8mb4;",
            "INSERT IGNORE INTO loja_mysql.clientes (id, nome, cidade) VALUES (1, 'Ana', 'São Lourenço do Oeste'), (2, 'João', 'Chapecó');",
            "SET SESSION cte_max_recursion_depth = 10000;",
            "CREATE TABLE IF NOT EXISTS loja_mysql.pedidos (id INT PRIMARY KEY AUTO_INCREMENT, cliente_id INT, valor DECIMAL(10,2));",
            "INSERT INTO loja_mysql.pedidos (cliente_id, valor) SELECT 1 + (n % 2), n * 1.5 FROM (WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM s WHERE n < 5000) SELECT n FROM s) t WHERE NOT EXISTS (SELECT 1 FROM loja_mysql.pedidos);",
            "CREATE PROCEDURE IF NOT EXISTS loja_mysql.total_clientes() SELECT COUNT(*) FROM loja_mysql.clientes;"
          ) | Set-Content -Encoding utf8NoBOM C:\mysql-init.sql
          "$mysqld" | Set-Content C:\mysqld-caminho.txt
      - name: Validar como um usuário (dois cliques no Sentinela-Demo.exe)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          MYSQL_TEST_PORT: "3307"
        run: |
          # O MySQL precisa ser iniciado neste mesmo passo: o GitHub encerra, no fim de
          # cada passo, os processos que ele iniciou.
          $mysqld = Get-Content C:\mysqld-caminho.txt
          Start-Process $mysqld -ArgumentList "--datadir=C:\mysql-dados", "--port=3307", "--init-file=C:\mysql-init.sql", "--console" `
                        -RedirectStandardError C:\mysql.err -RedirectStandardOutput C:\mysql.out -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 3307 -WarningAction SilentlyContinue).TcpTestSucceeded) { break }
            Start-Sleep 2
          }
          Start-Sleep 5
          Get-Content C:\mysql.err
          if (Select-String -Path C:\mysql.err -Pattern "\[ERROR\]" -Quiet) { throw "erro no MySQL de teste" }
          if (-not (Test-NetConnection 127.0.0.1 -Port 3307 -WarningAction SilentlyContinue).TcpTestSucceeded) { throw "MySQL de teste não está no ar" }
          python tests/ci/validar_portatil.py "C:\Teste Portátil\Sentinela"

  validar-instalador:
    needs: construir
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6   # só para rodar o roteiro de validação
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: Sentinela-Instalador
      - name: Simular PC sem PostgreSQL instalado
        shell: pwsh
        run: |
          Get-Service -Name "postgresql*" | Stop-Service -ErrorAction SilentlyContinue
          Rename-Item "C:\Program Files\PostgreSQL" "PostgreSQL-removido"
      - name: Instalar, usar, atualizar com o Sentinela rodando e desinstalar
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python tests/ci/validar_instalador.py "$PWD\Sentinela-Instalador.exe"

  publicar:
    needs: [validar, validar-instalador]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sentinela-Portatil-Windows
      - uses: actions/download-artifact@v4
        with:
          name: Sentinela-Instalador
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="portatil-${GITHUB_REF_NAME}"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          PRE=""; [ "$GITHUB_REF_NAME" != "main" ] && PRE="--prerelease"
          gh release create "$TAG" Sentinela-Instalador.exe Sentinela-Portatil-Windows.zip --target "$GITHUB_SHA" $PRE \
            --title "Sentinela para Windows ($GITHUB_REF_NAME)" \
            --notes "Tudo incluído (Python, PostgreSQL e MariaDB portáteis). Não precisa de Docker nem de administrador.

          **Instalador (recomendado):** baixe **Sentinela-Instalador.exe** e dê dois cliques. Se aparecer \"O Windows protegeu o computador\", clique em *Mais informações* > *Executar assim mesmo* (o instalador não é assinado). Os atalhos ficam no Menu Iniciar e na Área de Trabalho.

          **Portátil (sem instalar, roda até de pendrive):** baixe **Sentinela-Portatil-Windows.zip**, botão direito > Propriedades > Desbloquear, extraia e dê dois cliques em **Sentinela-Demo.exe** (apresentação) ou **Sentinela.exe**.

          Depois de configurar, ligue *Política de backup > Iniciar com o computador*: o Sentinela passa a rodar sozinho, sem janela, a cada vez que o Windows inicia.

          Requer Windows 10/11 64 bits. Validado automaticamente num Windows sem PostgreSQL nem Python instalados.
          Commit: ${GITHUB_SHA}"
